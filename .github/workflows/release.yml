name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for changelog

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test
        run: make test
        working-directory: src/mhl-runtime

      - name: Build VS Code extension
        working-directory: vscode-mhl
        run: |
          npm ci
          npm run compile
          npx --yes @vscode/vsce package

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach VS Code extension to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vsix=$(ls vscode-mhl/*.vsix | head -n1)
          gh release upload "${GITHUB_REF_NAME}" "$vsix"
