name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # The same mandatory checks ci.yml runs on every push/PR — a tag must come
  # from a commit that already passed this, not just `make test` (see the
  # maturity-audit's B5 finding: the previous release.yml only ran `make
  # test`, missing -race, govulncheck, functional-test, and every E2E suite).
  gate:
    uses: ./.github/workflows/gate.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # GoReleaser needs full history for changelog

      - name: Limit GoReleaser tag discovery to runtime releases
        # Only removes refs in this disposable checkout, never remote tags.
        # GoReleaser OSS cannot filter tag prefixes in its configuration.
        run: |
          git for-each-ref --format='%(refname)' 'refs/tags/extensions-v*' |
            while IFS= read -r ref; do git update-ref -d "$ref"; done

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build VS Code extension
        working-directory: vscode-mhl
        run: |
          npm ci
          npm run compile
          npx --yes @vscode/vsce package

      - name: Run GoReleaser
        # Uploads the .vsix built above as a release asset AND folds its
        # checksum into checksums.txt in this one pass (see
        # .goreleaser.yaml's release.extra_files / checksum.extra_files) — no
        # separate `gh release upload` step needed, and none that would leave
        # the .vsix attached but unchecksummed.
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
