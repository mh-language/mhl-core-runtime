name: CI

# No paths: filter — the previous scoping to src/mhl-runtime/** let changes
# under vscode-mhl/, tests_e2e/, docs/site/, install.sh/install.ps1 merge
# with zero validation (maturity-audit finding B5). The gate itself already
# separates concerns into independent jobs, so a change confined to one area
# only pays for the jobs relevant to it.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
