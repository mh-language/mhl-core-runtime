name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/mhl-runtime/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/mhl-runtime/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: src/mhl-runtime

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum

      - name: Vet
        run: go vet ./...

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Functional Test
        run: make functional-test