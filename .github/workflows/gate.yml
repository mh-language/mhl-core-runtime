name: Release Gate

# The single, mandatory set of checks a commit must pass before it can be
# tagged as a release (release.yml calls this before GoReleaser runs) and
# before it merges to main/develop (ci.yml calls this on every push/PR).
# Keeping it as one reusable workflow means there is exactly one gate to keep
# green, not two that can drift apart — see the maturity-audit follow-up
# (B5): the previous ci.yml/release.yml pair covered vet/build/test/
# functional-test only, with no -race, no govulncheck, and no coverage of
# vscode-mhl, docs/site, installers, or the MCP host E2E suite.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, test, race, govulncheck, functional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/mhl-runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test (race)
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Build
        run: make build

      - name: Functional test
        run: make functional-test

      - name: Cross-build (verify-release)
        run: make verify-release

      - name: Stage binary for MCP E2E
        run: cp dist/mhl ../../mhl-e2e-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: mhl-e2e-linux-amd64
          path: mhl-e2e-linux-amd64
          retention-days: 1

  e2e:
    name: E2E (MCP host)
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mhl-e2e-linux-amd64

      - name: Install fresh binary for the MCP host suite
        # Never a committed binary (see .gitignore's tests_e2e/**/mhl) — the
        # suite copies this reference binary into its per-scenario scratch dirs.
        run: |
          chmod +x mhl-e2e-linux-amd64
          cp mhl-e2e-linux-amd64 tests_e2e/cloud/mhl

      - name: MCP host E2E
        working-directory: tests_e2e/cloud/tests_mcp_pods
        run: ./run-all.sh

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: tests_e2e/cloud/tests_mcp_pods/logs-regression/
          retention-days: 7

  vscode:
    name: vscode-mhl (compile, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-mhl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run compile
      - run: npm audit --omit=dev

  docs:
    name: docs/site playground
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test playground.test.cjs

  installers:
    name: Installer smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build, install, execute and uninstall a local artifact
        if: runner.os != 'Windows'
        run: sh .github/scripts/installer-smoke.sh

      - name: Build, install, execute and uninstall a local artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/installer-smoke.ps1
