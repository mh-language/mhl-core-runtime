name: Studio release

# Publishes mhl studio (src/mhl-studio) installers to a GitHub Release when a
# `studio-vX.Y.Z` tag is pushed (cut it with src/mhl-studio/release.sh). The
# studio is versioned and released on its own, never as part of a language
# release (release.yml, `v*` tags), and this workflow is not in gate.yml.
#
# Tauri does not cross-compile, so each installer is built on its own OS:
#   macOS   aarch64 + x86_64  .dmg / .app
#   Windows x86_64            .msi / -setup.exe
#   Linux   x86_64            .deb / .rpm / .AppImage
# Every installer embeds the mhl runtime built for its target as the sidecar
# (scripts/build-sidecar.mjs, via tauri.conf.json's beforeBuildCommand).
#
# The installers are NOT code-signed yet: macOS Gatekeeper and Windows
# SmartScreen warn on first launch (the release notes say how to open them).
# Signing is a later step: Apple Developer ID + notarization secrets for
# tauri-action, a Windows code-signing certificate.
#
# Run it by hand (workflow_dispatch) to build every installer as workflow
# artifacts without publishing anything.
on:
  push:
    tags:
      - "studio-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/studio.yml

  version:
    name: Version matches the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Compare tauri.conf.json, package.json, package-lock.json and Cargo.toml
        working-directory: src/mhl-studio
        run: |
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          pkg="$(node -p "require('./package.json').version")"
          lock="$(node -p "require('./package-lock.json').version")"
          cargo="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          echo "tauri.conf.json=$conf package.json=$pkg package-lock.json=$lock Cargo.toml=$cargo"
          for v in "$pkg" "$lock" "$cargo"; do
            [ "$v" = "$conf" ] || { echo "::error::studio versions disagree (see above)"; exit 1; }
          done
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "studio-v$conf" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the studio version $conf"
            exit 1
          fi
          echo "version=$conf" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    if: github.ref_type == 'tag'
    needs: [checks, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=false
          case "$VERSION" in *-*) prerelease=true ;; esac
          cat > notes.md <<EOF
          Desktop designer for mhl workflows — the diagram and the code edit the same \`.mh\` file, and runs stream live. Each installer bundles the mhl runtime it needs.

          | Platform | Download |
          | --- | --- |
          | macOS (Apple Silicon) | \`mhl.studio_${VERSION}_aarch64.dmg\` |
          | macOS (Intel) | \`mhl.studio_${VERSION}_x64.dmg\` |
          | Windows | \`mhl.studio_${VERSION}_x64-setup.exe\` or \`.msi\` |
          | Linux | \`.AppImage\`, \`.deb\` or \`.rpm\` |

          ### These builds are not code-signed yet

          - **macOS** — if it says the app "is damaged" or "can't be opened", run \`xattr -dr com.apple.quarantine "/Applications/mhl studio.app"\` once after moving it to Applications (or right-click → Open).
          - **Windows** — SmartScreen shows "Windows protected your PC": click **More info → Run anyway**.
          - **Linux** — make the AppImage executable: \`chmod +x mhl.studio_*.AppImage\`.
          EOF
          # make_latest=false: the repository's "Latest" release stays the
          # language's (v*), which is what people expect from that badge.
          id="$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="mhl studio $VERSION" \
            -F body=@notes.md \
            -F draft=true \
            -F prerelease="$prerelease" \
            -f make_latest=false \
            --jq .id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: [checks, version, create-release]
    # create-release is skipped on a manual run: build anyway, as artifacts.
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.version.result == 'success' && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The sidecar's version comes from `git describe` over the runtime's v* tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/mhl-runtime/go.mod
          cache: true
          cache-dependency-path: src/mhl-runtime/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/mhl-studio/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src/mhl-studio/src-tauri -> target
          key: ${{ matrix.target }}
      - name: Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev patchelf file
      - name: npm ci
        working-directory: src/mhl-studio
        run: npm ci
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: src/mhl-studio
          args: --target ${{ matrix.target }}
          # Empty on a manual run: build only, upload nothing to a release.
          releaseId: ${{ needs.create-release.outputs.release-id }}
          includeUpdaterJson: false
      - name: Keep the installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mhl-studio-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: |
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src/mhl-studio/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [create-release, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only once every platform uploaded: a half-built release never goes public.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=false >/dev/null
          echo "published https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
