name: Publish VS Code extension

# Separate from release.yml, which runs for every runtime tag: the Marketplace
# rejects a version it already has, and the extension is versioned on its own.
#
# The Marketplace publisher's Trusted Publishing policy names this file, so
# renaming it means updating the policy too.

on:
  push:
    tags:
      - "extensions-v*.*.*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-mhl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: vscode-mhl/package-lock.json

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "extensions-v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npx --yes @vscode/vsce@4.1.0 package --out mhl-language.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vscode-mhl/mhl-language.vsix
          if-no-files-found: error

  # Only this job can mint an OIDC token, and it installs nothing from the repo.
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix

      # --skip-duplicate lets a failed run be re-run without failing on the
      # registry that already accepted this version.
      - name: Publish to the Visual Studio Marketplace
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath mhl-language.vsix --oidc --skip-duplicate

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX }}
        run: npx --yes ovsx@1.3.0 publish --packagePath mhl-language.vsix --skip-duplicate
