# The gateway<->mhl shared bearer secret (MHL_SERVE_TOKEN). In a real cluster
# this comes from an external secret store; here it is a plain placeholder.
# Override before applying, e.g.:
#   kubectl -n mhl-serve create secret generic mhl-serve-token \
#     --from-literal=token="$(openssl rand -hex 24)" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: mhl-serve-token
  namespace: mhl-serve
type: Opaque
stringData:
  token: "local-dev-change-me"
