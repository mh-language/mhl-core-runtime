# Local Redis for developing / testing the mhl-cache-redis extension.
#
#   docker compose up -d --wait     # Redis 7 on host :6380 -> container 6379
#   docker compose down -v          # stop and wipe
#
#   url = redis://localhost:6380/0
name: mhl-cache-redis

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
