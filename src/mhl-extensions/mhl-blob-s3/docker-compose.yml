# Local S3 for developing / testing the mhl-blob-s3 extension.
#
#   docker compose up -d          # MinIO on :9000 (API) and :9001 (console)
#   docker compose down -v        # stop and wipe the data volume
#
# Dev credentials (do NOT reuse anywhere real):
#   access key id     = mhl
#   secret access key = mhl-secret-key
#   bucket            = mhl-blob
#   endpoint          = http://localhost:9000
name: mhl-blob-s3

services:
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mhl
      MINIO_ROOT_PASSWORD: mhl-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot: wait for MinIO, then create the bucket the extension expects.
  createbucket:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 mhl mhl-secret-key; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing local/mhl-blob &&
      mc anonymous set none local/mhl-blob &&
      echo 'bucket mhl-blob ready'
      "

volumes:
  minio-data:
