# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# go.mod lives in src/mhl-runtime, not the repo root, so GoReleaser can't infer
# the project name from it — set it explicitly.
project_name: mhl

builds:
  - id: mhl
    dir: src/mhl-runtime
    main: ./cmd/mhl
    binary: mhl
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/mh-language/mhl-core-runtime/internal/cli.Version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64   # only darwin-arm64 is supported; Intel Mac is not published

archives:
  - id: default
    name_template: "mhl-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  # The VS Code extension is built in the workflow before this step runs
  # (npm run compile && vsce package), not by a GoReleaser `build` — folding
  # it in here is what gets it a checksums.txt entry at all. Without this,
  # install.sh / install.ps1's `grep … checksums.txt` finds nothing and skip
  # the extension even though the release does carry the .vsix.
  extra_files:
    - glob: ./vscode-mhl/*.vsix

changelog:
  # Use GitHub's own "Generate release notes" API for the release body.
  use: github-native

release:
  draft: false
  # Upload the pre-built .vsix as a release asset in the same GoReleaser pass
  # that writes checksums.txt (see checksum.extra_files above) — one atomic
  # step instead of the workflow's separate `gh release upload` afterward,
  # which attached the file but never recorded its checksum.
  extra_files:
    - glob: ./vscode-mhl/*.vsix
